<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Protected HTML</title>
  <style>
    :root { color-scheme: dark; --bg: #07111f; --panel: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --text: #edf6ff; --muted: #aabbd2; --brand: #3ee7b6; --danger: #ffbf69; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: radial-gradient(circle at 20% 10%, rgba(62,231,182,.22), transparent 28%), radial-gradient(circle at 80% 0%, rgba(75,141,255,.3), transparent 28%), linear-gradient(135deg, #07111f 0%, #102a47 100%); }
    .box { width: min(100%, 520px); padding: 34px; border: 1px solid var(--line); border-radius: 28px; background: var(--panel); box-shadow: 0 30px 80px rgba(0,0,0,.32); backdrop-filter: blur(18px); }
    .mark { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 18px; color: #07111f; background: linear-gradient(135deg, var(--brand), #8ef9dd); font-size: 28px; font-weight: 900; }
    h1 { margin: 22px 0 10px; font-size: clamp(2rem, 8vw, 3.2rem); line-height: .98; letter-spacing: -.055em; }
    p { margin: 0 0 22px; color: var(--muted); }
    label { display: block; margin: 0 0 8px; font-weight: 900; }
    .password-row { position: relative; }
    input { width: 100%; min-height: 54px; padding: 0 78px 0 16px; border: 1px solid var(--line); border-radius: 16px; color: var(--text); background: rgba(255,255,255,.09); outline: none; font: inherit; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(62,231,182,.13); }
    .show { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; border-radius: 999px; padding: 8px 11px; color: #07111f; background: var(--brand); font-weight: 900; cursor: pointer; }
    button.unlock { width: 100%; min-height: 54px; margin-top: 14px; border: 0; border-radius: 999px; color: #07111f; background: linear-gradient(135deg, var(--brand), #8ef9dd); font: inherit; font-weight: 900; cursor: pointer; }
    button.unlock:disabled { opacity: .7; cursor: wait; }
    .message { min-height: 24px; margin-top: 14px; color: var(--danger); font-weight: 800; }
    .meta { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true">⌘</div>
    <h1>Protected HTML</h1>
    <p>This file is encrypted. Enter the password to decrypt and open the protected HTML page.</p>
    <form id="unlockForm">
      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="current-password" autofocus>
        <button class="show" type="button" id="showPassword">Show</button>
      </div>
      <button class="unlock" type="submit" id="unlockButton">Decrypt and open</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>
    <div class="meta">Protected with AES-GCM and PBKDF2-SHA256. Passwords are not recoverable.</div>
  </main>

    const form = document.getElementById('unlockForm');
    const passwordInput = document.getElementById('password');
    const button = document.getElementById('unlockButton');
    const message = document.getElementById('message');
    const showPassword = document.getElementById('showPassword');

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password, salt, iterations) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }

    showPassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      showPassword.textContent = visible ? 'Show' : 'Hide';
      passwordInput.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) {
        message.textContent = 'Enter the password.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Decrypting...';
      message.textContent = '';

        const iv = base64ToBytes(payload.iv);
        const data = base64ToBytes(payload.data);
        const key = await deriveKey(password, salt, payload.iterations);
        const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        const html = new TextDecoder().decode(plainBuffer);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        message.textContent = 'Wrong password or corrupted encrypted file.';
        button.disabled = false;
        button.textContent = 'Decrypt and open';
      }
    });
